name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Python compiles
        run: uv run python -m compileall -q comfy_modal comfy_nodes tools
      - name: Shell and JS parse
        run: |
          bash -n tools/sync.sh
          node -e "new Function(require('fs').readFileSync('comfy_nodes/gpu_relay/js/gpu_status.js','utf8').replace(/^import .*$/mg,''))"
      - name: Graphs match ComfyUI's node definitions
        run: uv run pytest -q tests
      - name: Studio app type-checks, lints, is formatted, passes its tests and builds
        run: npm --prefix studio ci && npm --prefix studio run check && npm --prefix studio test && npm --prefix studio run build
      - name: No known vulnerabilities in the dependencies
        run: |
          npm --prefix studio audit --omit=dev --audit-level=high
          uv export --frozen --no-dev -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip
          uvx pip-audit -r comfy_modal/requirements-image.txt --no-deps --disable-pip
      - name: Workflows match the builder
        run: |
          uv run tools/build_workflows.py
          git diff --exit-code -- workflows/
