[project]
name = "comfypoke"
version = "0.1.0"
description = "ComfyUI on Modal: an always-on GUI and a GPU you poke awake"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5",
    "aiohttp>=3.9",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "cryptography>=50.0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "pytest>=9.2.0",
]
